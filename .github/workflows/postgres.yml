name: PostgreSQL Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/postgres.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/postgres.yml"

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: linear_ai_test
          POSTGRES_USER: linear_ai
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linear_ai -d linear_ai_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://linear_ai:ci-only-password@127.0.0.1:5432/linear_ai_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: pip install -e ".[dev]"
      - name: Run migrations
        run: alembic upgrade head
      - name: Run PostgreSQL integration tests
        run: pytest -q tests/integration
