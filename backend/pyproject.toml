[project]
name = "linear-ai-backend"
version = "0.1.0"
description = "Backend API and mathematical analysis service for Linear AI"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100